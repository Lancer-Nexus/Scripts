name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: './bin'
      - name: ShellCheck validation tests
        run: shellcheck bin/*.sh tests/*.sh
      - name: Validate systemd units
        run: |
          sudo apt-get update
          sudo apt-get install --yes systemd
          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT
          for unit in systemd/*.service; do
            # Release paths do not exist in CI; replace only executable paths
            # so systemd-analyze can validate the unit structure itself.
            sed \
              -e 's#/opt/lancer-nexus/current/agent/LancerNexus.Agent#/bin/true#g' \
              -e 's#/opt/lancer-nexus/current/coordinator/LancerNexus.Coordinator#/bin/true#g' \
              -e 's#/opt/lancer-nexus/current/gateway/LancerNexus.Gateway#/bin/true#g' \
              -e 's#/opt/lancer-nexus/current/client/LLServer#/bin/true#g' \
              -e 's#/opt/lancer-nexus/current/scripts/bin/ln-validate-instance-config.sh#/bin/true#g' \
              -e 's#/opt/lancer-nexus/current/scripts/bin/ln-wait-instance-ready.sh#/bin/true#g' \
              "$unit" > "$tmp_dir/$(basename "$unit")"
            systemd-analyze verify "$tmp_dir/$(basename "$unit")"
          done
      - name: Validate cross-repository instance configuration
        run: ./tests/test-instance-config.sh
